<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111b30"><meta name="description" content="IRA private offline-first assistant"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="stylesheet" href="style.css"><title>IRA | Personal Assistant</title></head><body><main class="shell"><header><div class="brand"><div class="orb">✦</div><div><strong>IRA</strong><small>YOUR PRIVATE ASSISTANT · V0.9.3</small></div></div><span id="status">● Ready</span></header><nav aria-label="Sections"><button class="active" data-tab="chat">Chat</button><button data-tab="tasks">Tasks</button><button data-tab="memory">Memory</button></nav><section id="chat" class="panel"><div class="welcome"><div class="halo">✧</div><h1>Good to see you.</h1><p>Hindi / Hinglish commands supported. Your data stays on this device.</p></div><div id="messages" aria-live="polite"></div><form id="chatForm" class="composer"><input id="chatInput" aria-label="Message" placeholder="Ask IRA or add a task..." autocomplete="off" required><button id="mic" type="button" title="Voice input" aria-label="Voice input">🎙</button><button type="submit" aria-label="Send">➤</button></form><div class="controls"><label><input type="checkbox" id="speak"> Speak replies</label><span id="voiceStatus"></span></div></section><section id="tasks" class="panel hidden"><h2>My tasks</h2><form id="taskForm" class="stack"><input id="taskTitle" placeholder="New task" required maxlength="1000"><input id="taskProject" placeholder="Project (e.g. The Last Coin)"><div class="twocol"><select id="priority"><option value="normal">Normal priority</option><option value="high">High priority</option><option value="low">Low priority</option></select><input type="date" id="due" aria-label="Due date"></div><button>Add task</button></form><div id="taskList" class="items"></div></section><section id="memory" class="panel hidden"><h2>Memory vault</h2><form id="memoryForm" class="stack"><textarea id="memoryNote" placeholder="Something IRA should remember..." required maxlength="1000"></textarea><input id="memoryProject" placeholder="Project (optional)"><button>Save memory</button></form><div id="memoryList" class="items"></div></section><footer><span>🔒 Local-first • ₹0 API cost</span><button id="export" type="button">Export backup</button><label class="import">Import backup<input id="import" type="file" accept="application/json,.json" hidden></label></footer></main><script src="engine.js"></script><script src="app.js"></script></body></html>
